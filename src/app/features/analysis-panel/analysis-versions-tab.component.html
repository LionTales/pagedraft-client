<div class="versions-tab-content" [attr.dir]="dir">
  <p class="muted" *ngIf="!bookId || !chapterId">{{ label('selectChapter') }}</p>
  <div *ngIf="bookId && chapterId">
    <p class="muted versions-hint">{{ label('hint') }}</p>
    <div class="versions-list" *ngIf="versions.length; else noVersions">
    <div class="version-item" *ngFor="let v of versions" [class.version-item-reverted]="isVersionReverted(v)">
      <div class="version-info">
        <span class="version-date">{{ versionTime(v.createdAt) }}</span>
        <ng-container *ngIf="versionLabelOriginal(v.label) && versionLabelSuggested(v.label); else plainLabel">
          <span class="version-original">{{ label('original') }} {{ versionLabelOriginal(v.label) }}</span>
          <span class="version-suggested">{{ label('suggested') }} {{ versionLabelSuggested(v.label) }}</span>
        </ng-container>
        <ng-template #plainLabel>
          <span class="version-label" *ngIf="v.label">{{ v.label }}</span>
        </ng-template>
      </div>
      <div class="version-actions">
        <button type="button" class="run-btn secondary btn-redo" *ngIf="isVersionReverted(v)" (click)="redoVersion.emit(v)">{{ label('redo') }}</button>
        <button type="button" class="run-btn secondary btn-revert" *ngIf="!isVersionReverted(v)"
          [disabled]="isVersionLocked(v)"
          [title]="isVersionLocked(v) ? label('revertLockedTitle') : ''"
          (click)="revert.emit(v.id)">
          {{ label('revert') }}
        </button>
      </div>
    </div>
  </div>
  <ng-template #noVersions>
    <p class="muted">{{ sceneId ? label('noVersionsScene') : label('noVersionsChapter') }}</p>
  </ng-template>
  </div>
</div>
