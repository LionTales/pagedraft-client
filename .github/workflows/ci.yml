# Run frontend tests on every push and PR targeting master.
# To require this check before merging: Repo → Settings → Branches → Branch protection (master) → Require status checks → "CI".

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx ng test --no-watch --browsers=ChromeHeadless
